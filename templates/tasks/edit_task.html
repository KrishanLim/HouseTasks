{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit task</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <form method="POST" class="edit-task-form">
        {% csrf_token %}

        <table class="edit_task">
            <tr>
                <th colspan="2">Edit Task</th>
            </tr>
            {% for task in tasks %}
            <tr>
                <td class="edit_task">
            <tr>
                <td>Name</td>
                <td><input type="text" name="task_name[]" value="{{task.task.name}}"></td>
            </tr>
            <tr>
                <td>Description</td>
                <td>
                    <textarea name="description[]" class="description-box" rows="6">{{task.task.description}}</textarea>
                </td>
            </tr>
            <!-- Popup buttons for add and remove members -->

            <tr>
                <td>Members</td>
                <td>
                    <div class="for-popup">
                        <button type="button" id="add_members" onclick="popup(this , 'add')">Add Members</button>
                        <button type="button" id="remove_members" onclick="popup(this , 'remove')">Remove
                            Members</button>
                        <!-- Assigns id with specific int value for displaying different popups -->
                        <div class="popup-add">
                            <h3>Add members</h3>
                            {% for member in task.not_assigned_members%}
                            <label>
                                <input type="checkbox" name="add_members" value="{{member}}">{{member}}</option><br>
                            </label>
                            {% endfor %}
                            <button type="button" id="close-popup" onclick="popup(this, 'close-add')">Close</button>
                        </div>
                        <div class="popup-remove">
                            <h3>Remove Members</h3>
                            {% for member in task.task.assigned_members.all %}
                            <label>
                                <input type="checkbox" name="remove_members" value="{{member}}">{{member}}<br>
                            </label>
                            {% endfor %}
                            <button type="button" onclick="popup(this, 'close-remove')">Close</button>
                        </div>
                    </div>

                </td>
            </tr>
            </td>
            </tr>
            {% endfor %}
        </table>
    </form>
    <script>
        const boxes = document.querySelectorAll("textarea.description-box");
        for (const box of boxes) {
            const autoResize = () => {
                box.style.height = "auto";
                box.style.height = box.scrollHeight + "px";
            };
            box.addEventListener("input", autoResize);
            autoResize();
        }

        function popup(button, type) {
            console.log('openpopup')
            let item = button.closest(".for-popup");

            if (type == "add") {
                let popup = item.querySelector(".popup-add");
                popup.classList.add("open-popup");
            }

            if (type == "close-add") {
                let popup = item.querySelector(".popup-add");
                popup.classList.remove("popup", "open-popup");
            }

            if (type == "remove") {
                let popup = item.querySelector(".popup-remove");
                popup.classList.add("popup", "open-popup");
            }

            if (type == "close-remove") {
                let popup = item.querySelector(".popup-remove");
                popup.classList.remove("popup", "open-popup");
            }

        }
    </script>
</body>

</html>
